<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
<title id="title">Toy Agent 学习进度与后续计划</title><desc id="desc">截至2026年10月11日，开发环境、模型调用、结构化摘要、工具调用、有界循环和摘要评估已经完成；候选提示词质量未通过。下一步建议先记录完整循环轨迹，再做端到端评估，最后整理可演示的只读项目。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif} .title{font-size:32px;font-weight:700;fill:#f8fafc}.section{font-size:22px;font-weight:650;fill:#e2e8f0}.head{font-size:19px;font-weight:650;fill:#f8fafc}.body{font-size:16px;fill:#cbd5e1}.small{font-size:14px;fill:#94a3b8}.green{fill:#6ee7b7}.amber{fill:#fcd34d}.blue{fill:#93c5fd}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<rect width="1200" height="1120" fill="#0b1220"/>
<text x="48" y="65" class="title">Toy Agent · 学习进度</text>
<text x="48" y="98" class="body">2026-10-11  /  Python + DeepSeek  /  从模型调用走向可验证的只读 Agent</text>
<rect x="48" y="121" width="1104" height="52" rx="12" fill="#152235"/>
<text x="68" y="154" class="body">当前位置：核心机制与评估流程已完成；提示词候选保留，质量验收尚未通过。</text>
<text x="48" y="216" class="section">01  已完成：核心机制</text>
<rect x="48" y="235" width="352" height="116" rx="14" fill="#122b2a" stroke="#6ee7b7" stroke-opacity=".35"/><text x="68" y="268" class="head">✓ 开发环境与模型调用</text><text x="68" y="300" class="body">Python / uv / .venv / VS Code</text><text x="68" y="325" class="body">密钥在仓库外 · 用量与失败提示</text><rect x="424" y="235" width="352" height="116" rx="14" fill="#122b2a" stroke="#6ee7b7" stroke-opacity=".35"/><text x="444" y="268" class="head">✓ 结构化摘要</text><text x="444" y="300" class="body">三个必填字符串数组 · 允许 []</text><text x="444" y="325" class="body">校验格式 · 拒绝截断与非法结构</text><rect x="800" y="235" width="352" height="116" rx="14" fill="#122b2a" stroke="#6ee7b7" stroke-opacity=".35"/><text x="820" y="268" class="head">✓ 只读工具调用</text><text x="820" y="300" class="body">get_project：虚构项目查询</text><text x="820" y="325" class="body">校验工具与参数 · 绑定调用 ID</text><rect x="48" y="369" width="352" height="116" rx="14" fill="#122b2a" stroke="#6ee7b7" stroke-opacity=".35"/><text x="68" y="402" class="head">✓ 有界 Agent Loop</text><text x="68" y="434" class="body">最多 5 次请求 · 明确停止条件</text><text x="68" y="459" class="body">任务内成功复用 · 无自动重试</text><rect x="424" y="369" width="352" height="116" rx="14" fill="#122b2a" stroke="#6ee7b7" stroke-opacity=".35"/><text x="444" y="402" class="head">✓ 摘要评估与迭代</text><text x="444" y="434" class="body">8 条样例 · 保存三轮原始输出</text><text x="444" y="459" class="body">保留改善与退步 · 固定评审规则</text><rect x="800" y="369" width="352" height="116" rx="14" fill="#122b2a" stroke="#6ee7b7" stroke-opacity=".35"/><text x="820" y="402" class="head">✓ 验收标准 V2</text><text x="820" y="434" class="body">事实保留 / 字段归属 / 表达关联</text><text x="820" y="459" class="body">按下游用途判断 · 历史结论保留</text><text x="48" y="524" class="section">02  当前边界：机制通过 ≠ 内容质量通过</text><rect x="48" y="543" width="1104" height="151" rx="14" fill="#30281a" stroke="#fcd34d" stroke-opacity=".35"/><text x="68" y="576" class="head">● 候选提示词：实验执行通过，质量验收未通过</text><text x="68" y="608" class="body">31 项离线测试通过；当前保存的 8 条输出关键事实均保留。</text><text x="68" y="633" class="body">3 条仍有字段问题：周五计划缺风险说明、条件计划扩张到阻塞、灰度计划缺不确定性。</text><text x="68" y="658" class="body">保留当前候选，不回退；暂停改词与模型调用。尚无稳定性或完整 Loop 的多样例质量证据。</text><text x="48" y="735" class="section">03  后续路线：先观察，再验证，再收尾</text><rect x="48" y="756" width="352" height="178" rx="14" fill="#15243a" stroke="#93c5fd" stroke-opacity=".35"/><text x="68" y="789" class="head">1  下一项建议：结果与轨迹</text><text x="68" y="821" class="body">返回结构化运行结果</text><text x="68" y="846" class="body">记录请求、工具执行、缓存命中</text><text x="68" y="871" class="body">记录用量、结束状态与失败原因</text><text x="68" y="896" class="body">先做离线模拟 · 提示词保持冻结</text><rect x="424" y="756" width="352" height="178" rx="14" fill="#15243a" stroke="#93c5fd" stroke-opacity=".35"/><text x="444" y="789" class="head">2  待规划：端到端验证</text><text x="444" y="821" class="body">项目查询 → Loop → 最终摘要</text><text x="444" y="846" class="body">加入未参与调优的新状态</text><text x="444" y="871" class="body">检查链路与内容，记录重复表现</text><text x="444" y="896" class="body">调用预算与验收范围另行确定</text><rect x="800" y="756" width="352" height="178" rx="14" fill="#15243a" stroke="#93c5fd" stroke-opacity=".35"/><text x="820" y="789" class="head">3  待规划：只读 MVP 收尾</text><text x="820" y="821" class="body">支持选择项目与外部虚构数据</text><text x="820" y="846" class="body">整理运行方式与演示案例</text><text x="820" y="871" class="body">写清架构、取舍和已知限制</text><text x="820" y="896" class="body">复盘后再进入后续工程项目</text><path d="M403 845 H418" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M779 845 H794" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="960" width="1104" height="109" rx="14" fill="#152235"/>
<text x="68" y="992" class="head">Toy Agent 的阶段目标</text>
<text x="68" y="1021" class="body">输入项目查询 → 获取状态 → 有界执行 → 输出摘要与运行轨迹 → 可以解释、验证和演示</text>
<text x="68" y="1047" class="small">MCP、RAG、写操作与审批暂不列为本阶段必做；后续蓝色节点是建议计划，尚未实现。</text>
<text x="48" y="1100" class="small">完成状态以代码与验证记录为准；无总完成百分比，避免把未知工作量当成已确定计划。</text>
</svg>