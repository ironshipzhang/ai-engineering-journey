<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1660" viewBox="0 0 1200 1660" role="img" aria-labelledby="title desc"><title id="title">Toy Agent 完整计划与进度</title><desc id="desc">已完成核心机制、评估练习及任务C结果与轨迹，下一项为D多项目与工具注册，随后为RAG、MCP、可靠性、端到端评估与CLI收尾。</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:32px;font-weight:700;fill:#f8fafc}.h{font-size:21px;font-weight:650;fill:#f8fafc}.b{font-size:17px;fill:#cbd5e1}.s{font-size:15px;fill:#94a3b8}</style></defs><rect width="1200" height="1660" fill="#0b1220" /><text x="48" y="65" class="title">Toy Agent · 完整学习路线与当前进度</text><text x="48" y="100" class="b">截至 2026-10-11   |   学习机制 → 构建只读 CLI → 演示与复盘 → 后续工程项目</text><text x="48" y="143" class="s">绿色：已完成阶段   蓝色：下一项   灰色：未实现计划   黄色：阶段切换说明</text><rect x="48" y="163" width="1104" height="120" rx="13" fill="#12332e" stroke="#6ee7b7" stroke-opacity=".6" /><text x="68" y="195" class="h">A · 基础与核心 Agent 机制  ✓ 已完成</text><text x="68" y="226" class="b">环境与 API 调用 → JSON 摘要校验 → 单个只读工具 → 有界 Loop 与任务内缓存</text><text x="68" y="253" class="b">局部状态、调用 ID、Token 用量、请求上限及失败停止已有实现；当前 39 项离线测试通过。</text><rect x="48" y="299" width="1104" height="120" rx="13" fill="#12332e" stroke="#6ee7b7" stroke-opacity=".6" /><text x="68" y="331" class="h">B · 最小内容评估与验收范式  ✓ 学习目标完成</text><text x="68" y="362" class="b">构造样例 → 批量采集 → 保存版本 → 人工语义复核 → 分离事实、字段与表达</text><text x="68" y="389" class="b">已保存三轮结果；采集和格式校验自动化，语义评分仍人工复核。</text><rect x="48" y="435" width="1104" height="112" rx="13" fill="#30281a" stroke="#fcd34d" stroke-opacity=".6" /><text x="68" y="467" class="h">阶段切换：内容评估练习已结束，进入多项目与工具注册</text><text x="68" y="498" class="b">历史评估记录保留；不再继续改词或追分，不将历史问题作为后续机制学习的阻塞项。</text><rect x="48" y="573" width="1104" height="115" rx="13" fill="#12332e" stroke="#6ee7b7" stroke-opacity=".6" /><text x="68" y="605" class="h">C · 任务状态、结构化结果与执行轨迹  ✓ 已完成</text><text x="68" y="636" class="b">成功/失败、摘要、请求次数、已知用量、工具执行与缓存命中、失败前轨迹</text><text x="68" y="663" class="b">39 项离线测试通过；正常真实运行与 JSON 文件保存均验证完成。</text><rect x="48" y="704" width="540" height="135" rx="13" fill="#173355" stroke="#93c5fd" stroke-opacity=".6" /><text x="68" y="736" class="h">D · 多项目与 Tool Registry  → 下一项</text><text x="68" y="767" class="b">外部虚构状态 + 第二个只读工具</text><text x="68" y="794" class="b">显式注册、参数校验、调度与模型选择</text><text x="68" y="821" class="b">每轮仍最多一个调用；不做插件平台。</text><rect x="612" y="704" width="540" height="135" rx="13" fill="#172337" stroke="#64748b" stroke-opacity=".6" /><text x="632" y="736" class="h">E · 最小 RAG  待实现</text><text x="632" y="767" class="b">虚构文档 → 切块 → embedding → 存储</text><text x="632" y="794" class="b">检索 → 来源标识 → 注入上下文 → 回答</text><text x="632" y="821" class="b">比较检索成功/失败；先核实来源与成本。</text><rect x="48" y="855" width="540" height="135" rx="13" fill="#172337" stroke="#64748b" stroke-opacity=".6" /><text x="68" y="887" class="h">F · 最小 MCP  待实现</text><text x="68" y="918" class="b">一个本地只读 Server + Agent Client</text><text x="68" y="945" class="b">与直接函数调用比较协议和执行边界</text><text x="68" y="972" class="b">SDK 与传输方案开工时确定。</text><rect x="612" y="855" width="540" height="135" rx="13" fill="#172337" stroke="#64748b" stroke-opacity=".6" /><text x="632" y="887" class="h">G · 失败策略与可靠性  待扩展</text><text x="632" y="918" class="b">超时/限流/工具错误分类 · 保留失败证据</text><text x="632" y="945" class="b">只读幂等请求有界重试 · 不确定性处理</text><text x="632" y="972" class="b">判断何时停止或降级；离线验证策略。</text><rect x="48" y="1006" width="1104" height="120" rx="13" fill="#172337" stroke="#64748b" stroke-opacity=".6" /><text x="68" y="1038" class="h">H · 完整任务端到端评估  待实现</text><text x="68" y="1069" class="b">输入 → 正确取数/工具选择 → 检索/MCP → 有界结束 → 摘要与轨迹</text><text x="68" y="1096" class="b">检查链路、来源、结构及内容；加入独立样例，按需重复采样并限制费用。</text><rect x="48" y="1142" width="1104" height="120" rx="13" fill="#172337" stroke="#64748b" stroke-opacity=".6" /><text x="68" y="1174" class="h">I · CLI 演示与学习验收  待实现</text><text x="68" y="1205" class="b">统一任务输入、配置、结果文件和运行说明；展示成功、失败与来源</text><text x="68" y="1232" class="b">保存可复现版本；能解释 Agent Loop / Tools / RAG / MCP / Evaluation 的关系。</text><rect x="48" y="1278" width="1104" height="100" rx="13" fill="#172337" stroke="#64748b" stroke-opacity=".6" /><text x="68" y="1310" class="h">可选探索：Skill 概念与流式输出</text><text x="68" y="1341" class="b">Skill 先定义与 Prompt / Tool / Workflow 的区别；两项按学习价值决定，不阻塞收尾。</text><rect x="48" y="1394" width="1104" height="132" rx="13" fill="#173355" stroke="#93c5fd" stroke-opacity=".6" /><text x="68" y="1426" class="h">终点：一个小而可解释、可观察、可验证的只读 Agent</text><text x="68" y="1457" class="b">输入任务 → 获取状态与资料 → 工具执行 → 输出有来源的结果与轨迹 → 评估与复盘</text><text x="68" y="1484" class="b">不要求虚构样例百分百正确；每项机制做最小实现，不扩建运营平台。</text><text x="68" y="1511" class="b">真实业务质量、写操作/审批、企业权限、服务部署与生产运行 → 后续工程项目。</text><text x="48" y="1560" class="s">当前位置：A / B / C 已完成 → D 下一项 → E → F → G → H → I；每新增机制先局部验证。</text><text x="48" y="1588" class="s">灰色节点是完整计划，不是已实现功能；一次只做一个任务，具体方案随实际问题调整。</text><text x="48" y="1616" class="s">没有总完成百分比：机制完成、内容质量和未来工作量分别表达。</text></svg>